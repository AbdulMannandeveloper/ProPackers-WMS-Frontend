<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Generated from public/Logo.png (1024x1024, 1.56MB) at the sizes browsers
      actually ask for. The tab was showing Vite's own logo, and pointing it at
      the full-size PNG would have meant a 1.56MB download for a 16px icon.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="ProPackers UK — warehouse management system" />

    <!-- What the tab says before React mounts. Each route sets its own after
         that, via TitledRoute in app.tsx. -->
    <title>ProPackers UK</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
